<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Epigaea</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <form id="register-form">
            <h2>Create Account</h2>
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" autocorrect="off" autocapitalize="none" spellcheck="false" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required>
            </div>
            <div class="input-group">
                <label for="admin-code">Admin Code <span style="font-size: 0.8em; color: #666;">(optional)</span></label>
                <input type="password" id="admin-code" name="adminCode" placeholder="Leave blank for standard user">
            </div>
            <div id="register-status" class="status-message" style="display: none;"></div>
            <button type="submit">Register</button>
            <div style="text-align: center; margin-top: 1rem;">
                <a href="index.html" style="color: #007bff; text-decoration: none;">Back to Login</a>
            </div>
        </form>
    </div>
    <script src="config.js"></script>
    <script src="register.js"></script>
</body>
</html>
